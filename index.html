    // aplica o tema antes de desenhar para não piscar
    (function () {
      var t = null;
      try { t = localStorage.getItem('nossa-casa-tema'); } catch (e) {}
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
