<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141416">
  <title>Nossa Casa</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23141416'/%3E%3Cpath d='M8 16l8-7 8 7M10 15v9h12v-9' fill='none' stroke='%23D4FF3A' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // aplica o tema antes de desenhar para não piscar
    (function () {
      var t = null;
      try { t = localStorage.getItem('nossa-casa-tema'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = 'dark'; // grafite é o padrão
      document.documentElement.dataset.theme = t;
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.content = t === 'dark' ? '#141416' : '#ECECE8';
    })();
  </script>
  <script src="js/vendor/chart.umd.js"></script>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <dialog id="modal"></dialog>
  <script type="module" src="js/app.js"></script>
</body>
</html>
